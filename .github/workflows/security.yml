name: Security

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  schedule:
    # Daily at 06:00 UTC. The scan always runs. Push and pull_request fail on
    # every advisory outside .github/security-allowlist.txt. The schedule
    # fails — and therefore emails — only when an advisory is outside that
    # allowlist and was not in the previous scheduled scan. Do not remove
    # this cron or mark the scanners continue-on-error for every event.
    - cron: "0 6 * * *"

permissions:
  contents: read
  actions: read             # previous scheduled finding artifacts
  security-events: write    # required for uploading SARIF to GitHub Security tab
  pull-requests: write      # required for dependency-review-action PR comments

jobs:
  osv-scan:
    name: OSV Scanner (all lockfiles)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # OSV-Scanner ignores ids in this file before it decides to fail.
      # The allowlist is empty unless an advisory has no patched release.
      - name: Write OSV ignore config
        run: python3 .github/security_schedule_gate.py write-osv-config .github/security-allowlist.txt osv-scanner.toml

      # Scans every lockfile in the repo. Single command covers npm + pip +
      # cargo + go etc. — uses Google's OSV.dev advisory DB which aggregates
      # GitHub Advisories, PyPA, RustSec, etc.
      # On the schedule, a repeated finding must not fail the job again.
      # The gate below compares this SARIF with the previous scheduled run.
      - name: Run OSV-Scanner
        id: osv
        continue-on-error: ${{ github.event_name == 'schedule' }}
        uses: google/osv-scanner-action/osv-scanner-action@v2.0.2
        with:
          scan-args: |-
            --output=results.sarif
            --format=sarif
            --recursive
            ./

      # Upload results to GitHub's Security tab so they show up alongside
      # Dependabot alerts and can be triaged in one place. Code scanning
      # opens an alert when a finding is new.
      - name: Upload SARIF
        if: always() && hashFiles('results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif

      - name: Alert only on new OSV advisories
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ steps.osv.outcome }}" = "failure" ] && [ ! -s results.sarif ]; then
            echo "OSV scanner failed without a SARIF report."
            exit 1
          fi
          if [ -f results.sarif ]; then
            python3 .github/security_schedule_gate.py extract-sarif results.sarif > "$RUNNER_TEMP/findings.txt"
          else
            : > "$RUNNER_TEMP/findings.txt"
          fi
          bash .github/download_previous_findings.sh \
            security-schedule-osv "$RUNNER_TEMP/previous.txt"
          cp "$RUNNER_TEMP/findings.txt" scheduled-findings.txt
          args=(--mode schedule --findings "$RUNNER_TEMP/findings.txt" --previous "$RUNNER_TEMP/previous.txt" --allowlist .github/security-allowlist.txt)
          if [ "${{ steps.osv.outcome }}" = "failure" ]; then
            args+=(--audit-failed)
          fi
          python3 .github/security_schedule_gate.py gate "${args[@]}"

      - name: Upload scheduled OSV finding set
        if: github.event_name == 'schedule' && always()
        uses: actions/upload-artifact@v4
        with:
          name: security-schedule-osv
          path: scheduled-findings.txt
          retention-days: 90
          if-no-files-found: warn

  dependency-review:
    name: Dependency Review (PR diff)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      # Fails the PR if it introduces a new dependency with a known
      # vulnerability. Complements osv-scan (which scans the whole repo)
      # by giving fast, diff-based feedback on PRs specifically.
      # Forks ship with the dependency graph turned off. The review API then
      # answers 404 on the SBOM route, and dependency-review-action turns that
      # into a failed job before it looks at the diff. Probe first and skip
      # only that case. A 200 means the graph is on, so the review below still
      # fails the job when the diff adds a vulnerable dependency.
      - name: Probe dependency graph
        id: graph
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/depgraph-sbom.json -w "%{http_code}" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/dependency-graph/sbom")
          echo "dependency-graph/sbom HTTP ${code}"
          if [ "$code" = "404" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Dependency graph is disabled, so dependency review cannot run."
            echo "Enable it at ${{ github.server_url }}/${{ github.repository }}/settings/security_analysis"
          elif [ "$code" = "200" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "Dependency graph probe returned HTTP ${code}; failing closed."
            cat /tmp/depgraph-sbom.json
            exit 1
          fi

      - name: Dependency Review
        if: steps.graph.outputs.available == 'true'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: always

  npm-audit:
    name: npm audit (web + extension)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package_dir: [web, extension]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # `npm ci` enforces the committed lockfile's SHA-512 integrity hashes;
      # it refuses to install if package.json drifted from package-lock.json.
      # This is the supply-chain hardening boundary we want in CI.
      - name: Install (strict, hash-verified)
        working-directory: ${{ matrix.package_dir }}
        run: npm ci --ignore-scripts

      - name: Audit (fail on moderate+)
        working-directory: ${{ matrix.package_dir }}
        env:
          GH_TOKEN: ${{ github.token }}
          SECURITY_EVENT: ${{ github.event_name }}
          SECURITY_ARTIFACT: security-schedule-npm-${{ matrix.package_dir }}
        run: |
          set -euo pipefail
          set +e
          npm audit --audit-level=moderate --json > "$RUNNER_TEMP/npm-audit.json"
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 1 ]; then
            echo "npm audit failed (exit $code)"
            exit "$code"
          fi
          if [ "$code" -ne 0 ]; then
            npm audit --audit-level=moderate || true
          else
            echo "found 0 vulnerabilities"
          fi
          python3 "$GITHUB_WORKSPACE/.github/security_schedule_gate.py" extract-npm \
            "$RUNNER_TEMP/npm-audit.json" > "$RUNNER_TEMP/findings.txt"
          args=(
            --findings "$RUNNER_TEMP/findings.txt"
            --allowlist "$GITHUB_WORKSPACE/.github/security-allowlist.txt"
          )
          if [ "$code" -ne 0 ]; then
            args+=(--audit-failed)
          fi
          if [ "$SECURITY_EVENT" = "schedule" ]; then
            bash "$GITHUB_WORKSPACE/.github/download_previous_findings.sh" \
              "$SECURITY_ARTIFACT" "$RUNNER_TEMP/previous.txt"
            cp "$RUNNER_TEMP/findings.txt" "$GITHUB_WORKSPACE/scheduled-findings.txt"
            args+=(--mode schedule --previous "$RUNNER_TEMP/previous.txt")
          else
            args+=(--mode strict)
          fi
          python3 "$GITHUB_WORKSPACE/.github/security_schedule_gate.py" gate "${args[@]}"

      - name: Upload scheduled npm finding set
        if: github.event_name == 'schedule' && always()
        uses: actions/upload-artifact@v4
        with:
          name: security-schedule-npm-${{ matrix.package_dir }}
          path: scheduled-findings.txt
          retention-days: 90
          if-no-files-found: warn

  pip-audit:
    name: pip-audit (api + mcp + converter + tests + ontowiki)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        path: [api, mcp, converter, tests, ontowiki]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit

      # api/ and mcp/ ship a hash-locked requirements.lock; others ship requirements.txt.
      - name: Audit
        env:
          GH_TOKEN: ${{ github.token }}
          SECURITY_EVENT: ${{ github.event_name }}
          SECURITY_ARTIFACT: security-schedule-pip-${{ matrix.path }}
        run: |
          set -euo pipefail
          req="${{ matrix.path }}/requirements.lock"
          if [ ! -f "$req" ]; then
            req="${{ matrix.path }}/requirements.txt"
          fi
          set +e
          pip-audit -r "$req" --strict --format json -o "$RUNNER_TEMP/pip-audit.json"
          code=$?
          set -e
          if [ "$code" -ne 0 ] && [ "$code" -ne 1 ]; then
            echo "pip-audit failed (exit $code)"
            exit "$code"
          fi
          if [ "$code" -ne 0 ]; then
            pip-audit -r "$req" --strict --desc || true
          else
            echo "No known vulnerabilities found"
          fi
          python3 .github/security_schedule_gate.py extract-pip \
            "$RUNNER_TEMP/pip-audit.json" > "$RUNNER_TEMP/findings.txt"
          args=(
            --findings "$RUNNER_TEMP/findings.txt"
            --allowlist .github/security-allowlist.txt
          )
          if [ "$code" -ne 0 ]; then
            args+=(--audit-failed)
          fi
          if [ "$SECURITY_EVENT" = "schedule" ]; then
            bash .github/download_previous_findings.sh \
              "$SECURITY_ARTIFACT" "$RUNNER_TEMP/previous.txt"
            cp "$RUNNER_TEMP/findings.txt" scheduled-findings.txt
            args+=(--mode schedule --previous "$RUNNER_TEMP/previous.txt")
          else
            args+=(--mode strict)
          fi
          python3 .github/security_schedule_gate.py gate "${args[@]}"

      - name: Upload scheduled pip finding set
        if: github.event_name == 'schedule' && always()
        uses: actions/upload-artifact@v4
        with:
          name: security-schedule-pip-${{ matrix.path }}
          path: scheduled-findings.txt
          retention-days: 90
          if-no-files-found: warn
